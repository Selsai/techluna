services:
  edge:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [frontend, backend]
    restart: unless-stopped
  frontend:
    build: ./frontend
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/exam}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      NOTIFICATION_URL: http://gateway:8000/notify
      SERVICE_KEY: ${SERVICE_KEY:?SERVICE_KEY required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
    depends_on: [mongo, gateway]
    restart: unless-stopped
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
  gateway:
    build: ./gateway
    environment:
      NOTIFI_SERVICE_URL: http://notifications:4002
      STOCK_SERVICE_URL: http://stock-management:4003
    depends_on: [notifications, stock-management]
    restart: unless-stopped
  notifications:
    build: ./microservices/notifications
    environment:
      SERVICE_KEY: ${SERVICE_KEY:?SERVICE_KEY required}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
    restart: unless-stopped
  stock-management:
    build: ./microservices/stock-management
    environment:
      BACKEND_URL: http://backend:5000
      SERVICE_KEY: ${SERVICE_KEY:?SERVICE_KEY required}
    depends_on: [mongo]
    restart: unless-stopped
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    profiles: [monitoring]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    volumes:
      - ${PROMETHEUS_CONFIG_FILE:-./monitoring/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on: [blackbox, alertmanager]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [monitoring]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped
volumes:
  mongo_data:
  caddy_data:
  prometheus_data:
