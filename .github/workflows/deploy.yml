name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [preproduction, production]
      publish_only:
        description: Publier l'image avant de créer le service Render
        required: true
        type: boolean
        default: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test && npm run build && npm run lint
        working-directory: frontend
      - run: npm ci && npm test
        working-directory: backend
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.render
          push: true
          tags: |
            ghcr.io/selsai/techluna:${{ inputs.environment }}
            ghcr.io/selsai/techluna:${{ github.sha }}
  deploy:
    if: ${{ !inputs.publish_only }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          TARGET: ${{ inputs.environment }}
          RENDER_PREPROD_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PREPROD_DEPLOY_HOOK_URL }}
          RENDER_PROD_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PROD_DEPLOY_HOOK_URL }}
        run: |
          if [ "$TARGET" = preproduction ]; then
            hook="$RENDER_PREPROD_DEPLOY_HOOK_URL"
          else
            hook="$RENDER_PROD_DEPLOY_HOOK_URL"
          fi
          if [ -z "$hook" ]; then echo 'Deploy hook Render manquant pour cet environnement.' >&2; exit 1; fi
          curl --fail --silent --show-error --request POST "$hook"
